name: Firmngin OTA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare keys.h
        env:
          KEYS_H: ${{ secrets.FIRMNGIN_KEYS_H }}
        run: |
          if [ -z "$KEYS_H" ]; then
            echo "Missing secret FIRMNGIN_KEYS_H (paste full keys.h from Firmngin dashboard)" >&2
            exit 1
          fi
          printf '%s\n' "$KEYS_H" > keys.h

      - name: Validate Firmngin target
        run: |
          if [ -z "${{ secrets.FIRMNGIN_DEVICE_SECRET_ID }}" ]; then
            echo "Missing secret FIRMNGIN_DEVICE_SECRET_ID (device Secret ID from Firmngin dashboard)" >&2
            exit 1
          fi

      - uses: firmngin/ota@v1.1.5
        with:
          token: ${{ secrets.FIRMNGIN_API_TOKEN }}
          device-secret-id: ${{ secrets.FIRMNGIN_DEVICE_SECRET_ID }}
          platform: arduino
          arduino-fqbn: esp32:esp32:esp32
          arduino-sketch: ard-ci-test.ino
          version: ci-${{ github.run_number }}
          release-notes: ${{ github.event.head_commit.message }}
