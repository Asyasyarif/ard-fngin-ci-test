name: Firmngin OTA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare keys.h
        env:
          KEYS_H: ${{ secrets.FIRMNGIN_KEYS_H }}
        run: |
          if [ -z "$KEYS_H" ]; then
            echo "Missing secret FIRMNGIN_KEYS_H (paste full keys.h from Firmngin dashboard)" >&2
            exit 1
          fi
          printf '%s\n' "$KEYS_H" > keys.h

      - uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 core and Firmngin library
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/firmngin/Firmngin-Arduino.git "$HOME/Arduino/libraries/Firmngin-Arduino"

      - uses: firmngin/ota@v1.1.1
        with:
          token: ${{ secrets.FIRMNGIN_API_TOKEN }}
          device-secret-id: ${{ vars.FIRMNGIN_DEVICE_SECRET_ID }}
          platform: arduino
          arduino-fqbn: esp32:esp32:esp32
          arduino-sketch: ard-ci-test.ino
          version: ci-${{ github.run_number }}
          release-notes: ${{ github.event.head_commit.message }}
